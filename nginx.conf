server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # SPA shell: never cache long-term
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Mutable JSON (content fallback / config): no long-lived caching
  location ~* \.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fingerprinted Angular bundles (name-HASH.js/css): immutable
  location ~* "^/[^/]+-[A-Za-z0-9]{8}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Other static assets: modest cache, 404 when missing (never index.html)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|map|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
